{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morty's Portal - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0d1a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        .hero { text-align: center; background: rgba(26, 26, 46, 0.85); padding: 50px 40px; border-radius: 20px; border: 2px solid #97CE4C; box-shadow: 0 0 30px rgba(151, 206, 76, 0.4); max-width: 90%; }
        h1 { color: #97CE4C; font-weight: 900; font-size: 3rem; text-shadow: 0 0 15px #97CE4C; margin-bottom: 40px; }
        .btn-portal { background-color: #F675DA; color: #0d0d1a; font-weight: bold; padding: 14px 50px; border-radius: 50px; border: none; font-size: 1.2rem; transition: 0.3s; box-shadow: 0 0 12px #F675DA; }
        .btn-portal:hover { background-color: #ff9ee5; box-shadow: 0 0 25px #F675DA; color: #0d0d1a; transform: scale(1.05); }
        .portal-gif { width: 200px; height: 200px; object-fit: contain; margin: 0 auto 30px auto; display: block; filter: drop-shadow(0 0 25px #97CE4C); }
        @media (max-width: 576px) {
            .hero { padding: 35px 20px; }
            h1 { font-size: 2.2rem; margin-bottom: 30px; }
            .portal-gif { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="{% static 'portal/img/portal.gif' %}" alt="Portal de Morty" class="portal-gif">
        <h1>Morty's Portal</h1>
        <a href="{% url 'login' %}" class="btn btn-portal">Acceso</a>
    </div>
</body>
</html>
