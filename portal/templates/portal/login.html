<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Morty's Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0d1a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; margin: 0; }
        .login-card { background: #1a1a2e; border: 2px solid #97CE4C; border-radius: 15px; padding: 40px; box-shadow: 0 0 20px rgba(151, 206, 76, 0.4); width: 100%; max-width: 400px; position: relative; }
        h2 { color: #97CE4C; text-align: center; margin-bottom: 30px; text-shadow: 0 0 10px #97CE4C; }
        .btn-portal { background-color: #F675DA; border: none; color: #0d0d1a; width: 100%; padding: 10px; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .btn-portal:hover { background-color: #ff9ee5; box-shadow: 0 0 15px #F675DA; color: #0d0d1a; }
        input { background-color: #0d0d1a !important; color: #fff !important; border: 1px solid #8A2BE2 !important; border-radius: 6px !important; padding: 8px !important; width: 100% !important; box-sizing: border-box; }
        input:focus { box-shadow: 0 0 10px #8A2BE2 !important; outline: none !important; }
        label { color: #8A2BE2; margin-top: 10px; display: block; }
        .back-link { position: absolute; top: 15px; left: 20px; color: #BEE5FD; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #97CE4C; }
        .errorlist { color: #F675DA; list-style: none; padding: 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <a href="{% url 'home' %}" class="back-link">&larr; Volver al inicio</a>
        <h2>Acceso al Portal</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-portal mt-3">Entrar</button>
        </form>
    </div>
</body>
</html>
